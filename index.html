<html lang="th">
<head>

<title>ว30252 วิทยาศาสตร์กับภูมิปัญญา · ห้องเรียนออนไลน์</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--paper:#F6F3EC;--ink:#1A1F2E;--ink2:#2A2F3C;--muted:#5A5F6B;--line:#E2DDD2;--indigo:#233A73;--indigo-d:#172650;--night:#17244A;--sun:#E2A42B;--sun-t:#E9B44C;--sun-bg:#FBF1DC;--sun-fg:#7A4F00;--ok:#1E6B4F;--ok-bg:#E3F1EA;--ok-fg:#14513B;--bad:#9C2F24;--bad-bg:#F8E6E3;--tint:#EEF0F6;--sand:#F1ECE1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Anuphan","Leelawadee UI","Tahoma",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--indigo)}a:hover{color:var(--indigo-d)}
p{text-wrap:pretty}
.serif{font-family:"Noto Serif Thai","Tahoma",serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.jok{height:12px;background:repeating-linear-gradient(45deg,var(--sun) 0 5px,transparent 5px 10px),repeating-linear-gradient(-45deg,#B03A2E 0 5px,var(--night) 5px 10px)}
.jok-thin{height:6px;background:repeating-linear-gradient(45deg,var(--sun) 0 3px,transparent 3px 6px),repeating-linear-gradient(-45deg,var(--indigo) 0 3px,var(--paper) 3px 6px)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.btn{font:inherit;font-size:15px;font-weight:600;border:0;cursor:pointer;min-height:44px;padding:0 20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--indigo);color:#fff}.btn-pri:hover{background:var(--indigo-d);color:#fff}
.btn-pri:disabled{background:#9AA3BA;cursor:not-allowed}
.btn-sun{background:var(--sun);color:var(--ink)}.btn-sun:hover{background:#EDB548;color:var(--ink)}
.btn-ghost{background:#fff;color:var(--indigo);box-shadow:inset 0 0 0 1.5px #C9C2B2}.btn-ghost:hover{background:#ECE6D8}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed}
.btn-light{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1.5px rgba(246,243,236,.45)}.btn-light:hover{background:rgba(246,243,236,.1);color:var(--paper)}
.btn-ok{background:var(--ok-bg);color:var(--ok-fg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--indigo)}
.chip.sun{background:var(--sun-bg);color:var(--sun-fg)}
.eyebrow{font-size:13.5px;font-weight:600;color:#8A5A00;letter-spacing:.04em}
.h2{margin:0;font-size:32px;line-height:1.35}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.bar{height:6px;border-radius:99px;background:#E9E4D8;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;transition:width .3s}
/* header */
.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-height:44px}
.brand b{display:block;font-size:16px}.brand small{display:block;font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.navbtn{font:inherit;font-size:15px;border:0;cursor:pointer;min-height:44px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink2);background:transparent}
.navbtn:hover{background:#ECE6D8;color:var(--ink2)}
.navbtn.on{background:var(--indigo);color:#fff;font-weight:600}
.me{font:inherit;display:flex;align-items:center;gap:8px;margin-left:6px;padding:6px 12px;min-height:40px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:#3C4150;cursor:pointer}
.me:hover{background:#FBF9F4}
/* hero */
.hero{background:var(--night);color:var(--paper)}
.hero .wrap{display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding-top:64px;padding-bottom:56px}
.hero h1{margin:0;font-size:clamp(36px,5.2vw,60px);line-height:1.25}
.pill{display:inline-flex;align-self:flex-start;font-size:13.5px;color:var(--sun-t);border:1px solid rgba(233,180,76,.45);border-radius:999px;padding:6px 14px}
.prog-panel{background:rgba(246,243,236,.06);border:1px solid rgba(246,243,236,.18);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}
.step{padding:22px;display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
/* unit */
.uhead{background:var(--night);color:var(--paper)}
.layout{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;padding-top:32px;padding-bottom:72px}
.side{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:18px}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:22px}
.side-label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;padding:0 12px 4px}
.side-item{width:100%;text-align:left;min-height:44px;padding:8px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:14.5px;line-height:1.45;text-decoration:none;color:var(--ink2)}
.side-item:hover{background:var(--sand);color:var(--ink2)}
.side-item.on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--indigo);color:var(--indigo-d);font-weight:600}
.side-item small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.dot{flex:none;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:inset 0 0 0 1.5px #B9B2A2}
.dot.done{background:var(--ok);box-shadow:none}
.kind{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.content{padding:28px;display:flex;flex-direction:column;gap:18px}
.content h3{margin:10px 0 0;font-size:21px;line-height:1.45;color:var(--indigo-d)}
.content p{margin:0;font-size:16px;line-height:1.8;color:var(--ink2)}
.content ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15.5px;line-height:1.7;color:var(--ink2)}
.sec{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.sec span{font-size:13px;font-weight:700;color:#fff;background:var(--indigo);border-radius:8px;padding:5px 12px}
.sec strong{font-size:17px}
.note{background:var(--tint);border-radius:12px;padding:16px 18px;font-size:15.5px;line-height:1.75;color:var(--indigo-d)}
.formula{align-self:flex-start;background:var(--night);color:var(--paper);border-radius:10px;padding:12px 16px;font-size:15.5px;line-height:1.6}
.formula b{color:var(--sun-t);font-weight:600}
.warn{display:flex;gap:12px;align-items:flex-start;background:var(--sun-bg);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.6;color:#4A3300}
.tbl-box{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.tr{display:grid;font-size:14.5px;line-height:1.6;border-top:1px solid #EEEAE0}
.tr.th{background:var(--tint);color:var(--indigo-d);font-weight:600;border-top:0;border-bottom:1px solid #D8DCE8}
.th+.tr{border-top:0}
.td{padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.td.lab{font-weight:600;color:var(--indigo-d);background:#FBF9F4}
.td.in{padding:8px}
.inp{font:inherit;font-size:15px;width:100%;min-width:0;border:1px solid #CFC8B8;border-radius:8px;padding:8px 10px;background:#FDFCF9;color:var(--ink);resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);background:#fff}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:15px;font-weight:600;line-height:1.6}
.checks{display:flex;flex-direction:column;gap:2px;background:#FBF9F4;border:1px solid var(--line);border-radius:12px;padding:12px 18px}
.chk{font:inherit;text-align:left;cursor:pointer;border:0;background:transparent;min-height:44px;display:flex;gap:12px;align-items:center;font-size:15px;padding:4px 0;color:var(--ink)}
.box{flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:inset 0 0 0 1.5px #B9B2A2}
.box.on{background:var(--ok);box-shadow:none}
.seg-wrap{display:flex;flex-wrap:wrap;gap:4px;background:var(--sand);padding:4px;border-radius:10px;align-self:flex-start}
.seg{font:inherit;font-size:14px;border:0;cursor:pointer;min-height:40px;padding:0 14px;border-radius:8px;background:transparent;color:#3C4150}
.seg.on{background:#fff;color:var(--indigo-d);font-weight:600;box-shadow:0 1px 2px rgba(23,36,74,.15)}
.sendbar{padding:20px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.status{font-size:14px;color:var(--muted);line-height:1.6}
.status.ok{color:var(--ok-fg)}.status.bad{color:var(--bad)}
/* quiz */
.q{padding:24px 26px;display:flex;flex-direction:column;gap:14px}
.qno{flex:none;min-width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--indigo);font-weight:700;display:flex;align-items:center;justify-content:center}
.opt{font:inherit;width:100%;text-align:left;cursor:pointer;min-height:48px;padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;background:#fff;border:1.5px solid #DDD7CA;color:var(--ink)}
.opt:hover:not(:disabled){border-color:#9AA3BA}
.opt:disabled{cursor:default}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--sand);color:#3C4150}
.opt.sel{background:var(--tint);border-color:var(--indigo)}.opt.sel .l{background:var(--indigo);color:#fff}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt .tag{flex:none;font-size:12px;font-weight:700;padding-top:4px}
.ex{border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.7}
.ex.ok{background:var(--ok-bg);color:var(--ok-fg)}.ex.no{background:var(--sun-bg);color:#4A3300}
.ring{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring>div{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* footer, dialog, toast */
.foot{margin-top:auto;background:var(--night);color:#C3C9DB}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:24px;padding-bottom:28px;font-size:13.5px;line-height:1.7}
dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100% - 32px));color:var(--ink);box-shadow:0 20px 60px rgba(23,36,74,.3)}
dialog::backdrop{background:rgba(23,36,74,.45)}
.dlg{padding:26px;display:flex;flex-direction:column;gap:14px}
.dlg label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.dlg input{font:inherit;font-size:15px;min-height:44px;border:1px solid #CFC8B8;border-radius:8px;padding:8px 12px;background:#FDFCF9}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#app{min-height:100vh;display:flex;flex-direction:column}
@media (max-width:900px){.side{order:2}}
@media (max-width:700px){.top{position:static}.me{margin-left:0}}
@media (max-width:640px){.hero .wrap{padding-top:44px}.content{padding:20px}.q{padding:20px}.h2{font-size:26px}}
@media print{
  .top,.side,.foot,.uhead .jok,.noprint,#toast{display:none!important}
  body{background:#fff}.uhead{background:#fff;color:#000}.uhead *{color:#000!important}
  .layout{padding:0}.card{border:0}.content{padding:0}
  .tbl-box{overflow:visible}.tr{break-inside:avoid}
  .inp{border:1px solid #999;resize:none;background:#fff}
}
</style>
</head>
<body>
<div id="app"></div>

<dialog id="prof" aria-labelledby="profTitle">
<form class="dlg" method="dialog" id="profForm">
<strong id="profTitle" class="serif" style="font-size:22px">ข้อมูลนักเรียน</strong>
<span style="font-size:14px;color:var(--muted);line-height:1.6">ใช้แนบไปกับใบงานและคะแนนที่ส่งให้ครู กรอกครั้งเดียว ระบบจำไว้ในเครื่องนี้</span>
<label>ชื่อ–นามสกุล<input name="name" required autocomplete="name"></label>
<div class="row2">
<label>ชั้น<input name="room" required placeholder="เช่น ม.4/1"></label>
<label>เลขที่<input name="no" required inputmode="numeric"></label>
</div>
<label>กลุ่ม / ทีม<input name="group" placeholder="เช่น กลุ่ม 2 (ไม่บังคับ)"></label>
<div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px">
<button type="button" class="btn btn-ghost" id="profCancel">ยกเลิก</button>
<button type="submit" class="btn btn-pri">บันทึก</button>
</div>
</form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

function blockHTML(b, bi, prefix) {
  switch (b.t) {
    case 'h': return '<h3 class="serif">' + esc(b.text) + '</h3>';
    case 's': return '<div class="sec"><span>' + esc(b.tag) + '</span><strong>' + esc(b.text) + '</strong></div>';
    case 'p': return '<p>' + (b.lead ? '<strong>' + esc(b.lead) + '</strong>' : '') + esc(b.text) + '</p>';
    case 'note': return '<div class="note">' + (b.lead ? '<strong>' + esc(b.lead) + '</strong>' : '') + esc(b.text) + '</div>';
    case 'x': return '<div class="formula">' + (b.lead ? '<b>' + esc(b.lead) + '</b>' : '') + esc(b.text) + '</div>';
    case 'list': return '<ul>' + b.items.map(function (x) { return Array.isArray(x) ? '<li><strong>' + esc(x[0]) + '</strong>' + esc(x[1]) + '</li>' : '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    case 'table':
      var n = b.head.length, rest = b.grid ? 170 : 140;
      var cols = 'grid-template-columns:minmax(96px,.7fr)' + new Array(n).join(' minmax(' + rest + 'px,1fr)');
      var h = '<div class="tbl-box"><div role="table" style="min-width:' + (96 + rest * (n - 1)) + 'px"><div role="row" class="tr th" style="' + cols + '">' + b.head.map(function (x) { return '<div role="columnheader" class="td">' + esc(x) + '</div>'; }).join('') + '</div>';
      b.rows.forEach(function (r, ri) {
        h += '<div role="row" class="tr" style="' + cols + '">' + r.map(function (c, ci) {
          if (c === null) { var key = prefix + '-' + bi + '-' + ri + '-' + ci; return '<div role="cell" class="td in"><textarea class="inp" rows="2" data-key="' + key + '" aria-label="' + esc(b.head[ci] + ' แถวที่ ' + (ri + 1)) + '">' + esc(S.ans[key] || '') + '</textarea></div>'; }
          return '<div role="cell" class="td' + (b.grid && ci === 0 ? ' lab' : '') + '">' + esc(c) + '</div>';
        }).join('') + '</div>';
      });
      return h + '</div></div>';
    case 'field':
      var fk = prefix + '-f' + bi;
      return '<div class="field"><label for="' + fk + '">' + esc(b.label) + '</label><textarea id="' + fk + '" class="inp" rows="' + b.rows + '" data-key="' + fk + '" placeholder="' + esc(b.ph) + '">' + esc(S.ans[fk] || '') + '</textarea></div>';
    case 'check':
      return '<div class="checks"><span style="font-size:13px;font-weight:700;color:var(--muted);padding:4px 0">' + esc(b.label) + '</span>' + b.items.map(function (t, ci) {
        var ck = prefix + '-c' + bi + '-' + ci, on = !!S.chk[ck];
        return '<button type="button" class="chk" data-act="chk" data-key="' + ck + '" aria-pressed="' + on + '"><span class="box' + (on ? ' on' : '') + '">' + (on ? ICON_CHECK : '') + '</span><span style="line-height:1.55">' + esc(t) + '</span></button>';
      }).join('') + '</div>';
  }
  return '';
}

function sendStatus(key, kindWord) {
  var sent = S.sent[key];
  if (sending[key]) return '<span class="status">กำลังส่ง…</span>';
  if (sent) return '<span class="status ok">ส่ง' + kindWord + 'ถึงครูแล้ว · ' + esc(fmtTime(sent)) + '</span>';
  if (!SCRIPT_URL) return '<span class="status">ครูยังไม่ได้เปิดระบบส่งงาน ทำใบงานไว้ก่อนได้ ระบบจำคำตอบไว้ในเครื่องนี้</span>';
  return '<span class="status">ยังไม่ได้ส่ง' + (profileOk() ? '' : ' · กรอกข้อมูลนักเรียนก่อนส่ง') + '</span>';
}

function quizHTML(u, it) {
  var picks = S.qa[it.id] || {}, checked = !!S.qc[it.id], score = 0, answered = 0;
  var qs = it.qs.map(function (q, qi) {
    var sel = picks[qi]; if (sel !== undefined) answered++; var right = sel === q.a; if (checked && right) score++;
    var opts = q.o.map(function (t, oi) {
      var cls = 'opt', tag = '';
      if (!checked && sel === oi) cls += ' sel';
      if (checked && oi === q.a) { cls += ' right'; tag = '<span class="tag" style="color:var(--ok-fg)">คำตอบที่ถูก</span>'; }
      if (checked && sel === oi && oi !== q.a) { cls += ' wrong'; tag = '<span class="tag" style="color:#7E241B">คำตอบของฉัน</span>'; }
      return '<button type="button" class="' + cls + '" data-act="pick" data-q="' + qi + '" data-o="' + oi + '" aria-pressed="' + (sel === oi) + '"' + (checked ? ' disabled' : '') + '><span class="l">' + LET[oi] + '</span><span style="flex:1;padding-top:2px">' + esc(t) + '</span>' + tag + '</button>';
    }).join('');
    var ex = checked ? '<div class="ex ' + (right ? 'ok' : 'no') + '"><strong>' + (right ? 'ถูกต้อง —' : 'เฉลย ' + LET[q.a] + ' —') + '</strong> ' + esc(q.ex) + '</div>' : '';
    return '<section class="card q"><div style="display:flex;gap:12px;align-items:flex-start"><span class="qno">' + (qi + 1) + '</span><div style="display:flex;flex-direction:column;gap:4px;padding-top:5px"><span style="font-size:12.5px;color:var(--muted)">ระดับ: ' + esc(q.lv) + '</span><strong style="font-size:16.5px;line-height:1.65">' + esc(q.q) + '</strong></div></div><div role="group" aria-label="ตัวเลือกข้อ ' + (qi + 1) + '" style="display:flex;flex-direction:column;gap:8px">' + opts + '</div>' + ex + '</section>';
  }).join('');
  var total = it.qs.length, pct = Math.round(score * 100 / total), pass = pct >= 80, key = 'quiz-' + it.id;
  var res = '';
  if (checked) {
    res = '<div class="card" style="padding:24px 26px;display:flex;flex-direction:column;gap:18px">' +
      '<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between"><div style="display:flex;gap:20px;align-items:center"><div class="ring" style="background:conic-gradient(' + (pass ? 'var(--ok)' : '#C0392B') + ' ' + (pct * 3.6) + 'deg,#EEEAE0 0deg)"><div><span class="serif" style="font-size:24px;font-weight:700;line-height:1">' + score + '</span><span style="font-size:12px;color:var(--muted)">จาก ' + total + '</span></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:4px"><strong style="font-size:19px;color:' + (pass ? 'var(--ok-fg)' : '#7E241B') + '">' + (pass ? 'ผ่านเกณฑ์ ' + pct + '% · เข้าใจดีมาก' : 'ได้ ' + pct + '% · ยังไม่ถึงเกณฑ์ 80%') + '</strong><span style="font-size:14.5px;color:var(--muted);line-height:1.6;max-width:460px">' + (pass ? 'อ่านคำอธิบายเฉลยของแต่ละข้อเพื่อทบทวนอีกครั้ง แล้วไปต่อที่หน่วยถัดไปได้เลย' : 'อ่านคำอธิบายเฉลยใต้แต่ละข้อ กลับไปทบทวนใบความรู้ของหน่วยนี้ แล้วลองทำใหม่อีกครั้ง') + '</span></div></div>' +
      '<button type="button" class="btn btn-ghost noprint" data-act="retry">ทำแบบทดสอบใหม่</button></div>' +
      '<div class="noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px">' + sendStatus(key, 'คะแนน') +
      (SCRIPT_URL && !S.sent[key] && !sending[key] ? '<button type="button" class="btn btn-pri" data-act="sendquiz">ส่งคะแนนให้ครู</button>' : '') + '</div></div>';
  }
  var foot = checked ? '' : '<div class="card sendbar noprint"><span class="status">ตอบแล้ว ' + answered + ' จาก ' + total + ' ข้อ · ตอบครบทุกข้อจึงส่งคำตอบได้</span><button type="button" class="btn btn-pri" data-act="submitquiz"' + (answered < total ? ' disabled' : '') + '>ส่งคำตอบและดูเฉลย</button></div>';
  return '<div style="display:flex;flex-direction:column;gap:16px">' + res + qs + foot + '</div>';
}

  var groups = [['เริ่มต้น', 'o'], ['ใบความรู้', 'k'], ['ใบงาน', 'w'], ['ทดสอบหลังเรียน', 'q']].map(function (g) {

  }).join('');
  var km = { o: ['ภาพรวมหน่วย', 'var(--tint)', 'var(--indigo)'], k: [it.code, 'var(--tint)', 'var(--indigo)'], w: [it.code, 'var(--sun-bg)', 'var(--sun-fg)'], q: ['ทดสอบหลังเรียน', 'var(--ok-bg)', 'var(--ok)'] }[it.kind];

  if (it.kind === 'w') head += '<div class="warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A4F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><div><strong>ใบงานนี้ไม่มีเฉลย</strong><br>คิดและเขียนด้วยคำของตัวเอง/ของกลุ่ม คำตอบบันทึกอัตโนมัติในเครื่องนี้ ทำเสร็จแล้วกด “ส่งใบงานให้ครู” ท้ายหน้า</div></div>';
  if (it.intro) head += '<p style="margin:0;font-size:15.5px;line-height:1.75;color:#3C4150">' + esc(it.intro) + '</p>';
  if (it.perSource) head += '<div class="noprint" style="display:flex;flex-direction:column;gap:8px;padding-top:4px"><span style="font-size:13px;font-weight:600;color:var(--muted)">ใบงานชุดนี้ใช้ซ้ำทุกแหล่ง เลือกแหล่งที่กำลังทำ</span><div class="seg-wrap" role="group" aria-label="เลือกแหล่ง">' + C.SRC.map(function (n, k) { return '<button type="button" class="seg' + (k === S.src ? ' on' : '') + '" data-act="src" data-k="' + k + '" aria-pressed="' + (k === S.src) + '">แหล่งที่ ' + (k + 1) + ' · ' + esc(n) + '</button>'; }).join('') + '</div></div>';
  head += '</header>';

  var body = it.kind === 'q' ? quizHTML(u, it) : '<div class="card content">' + it.blocks.map(function (b, bi) { return blockHTML(b, bi, prefix); }).join('') + '</div>';
  if (it.kind === 'w') {
    var key = 'work-' + prefix;
    body += '<div class="card sendbar noprint"><div style="display:flex;flex-direction:column;gap:2px">' + sendStatus(key, 'ใบงาน') + (profileOk() ? '<span class="status">ผู้ส่ง: ' + esc(S.student.name) + ' · ' + esc(S.student.room) + ' เลขที่ ' + esc(S.student.no) + (S.student.group ? ' · ' + esc(S.student.group) : '') + '</span>' : '') + '</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-ghost" data-act="print">พิมพ์ / บันทึก PDF</button><button type="button" class="btn btn-pri" data-act="sendwork">' + (S.sent[key] ? 'ส่งฉบับแก้ไขอีกครั้ง' : 'ส่งใบงานให้ครู') + '</button></div></div>';
  }

  var prev = r.ii > 0 ? link(r.ui, r.ii - 1) : (r.ui > 0 ? link(r.ui - 1, C.units[r.ui - 1].items.length - 1) : '');

    '<button type="button" class="btn btn-pri" data-act="next">' + esc(nextLabel) + ICON_ARROW + '</button></div>';

  var s = st.per[r.ui];

    '<section class="uhead"><div class="wrap" style="padding-top:32px;padding-bottom:30px;display:flex;flex-direction:column;gap:14px">' +

    '<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between"><div style="flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:8px"><h1 class="serif" style="margin:0;font-size:clamp(26px,3.6vw,40px);line-height:1.35">หน่วยที่ ' + u.no + ' · ' + esc(u.title) + '</h1><p style="margin:0;font-size:16px;line-height:1.7;color:#D9DDEA;max-width:760px">' + esc(u.short) + '</p></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px"><span style="font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid rgba(246,243,236,.3)">' + u.hours + ' ชั่วโมง · ' + esc(u.periods) + '</span><span style="font-size:13px;padding:6px 12px;border-radius:999px;background:var(--sun);color:var(--ink);font-weight:600">' + esc(u.weight) + '</span></div></div>' +
    '</div><div class="jok"></div></section>' +
    '<div class="wrap layout"><aside class="side" aria-label="บทเรียนในหน่วย"><div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>ความคืบหน้าหน่วยนี้</span><strong style="color:var(--ink)">' + s.pct + '%</strong></div><div class="bar"><span style="width:' + s.pct + '%;background:var(--ok)"></span></div></div>' + groups + '</aside>' +
    '<article class="main">' + head + body + nav + '</article></div></main>';
}

/* ---------- ส่งข้อมูลไป Google Sheets ---------- */
function collect(it) {
  var prefix = prefixOf(it), lines = [], filled = 0, total = 0;
  it.blocks.forEach(function (b, bi) {
    if (b.t === 's') lines.push('■ ' + b.tag + ' ' + b.text);
    if (b.t === 'field') { total++; var v = (S.ans[prefix + '-f' + bi] || '').trim(); if (v) filled++; lines.push('• ' + b.label + '\n   ' + (v || '-')); }
    if (b.t === 'table' && b.grid) b.rows.forEach(function (row, ri) {
      var label = typeof row[0] === 'string' ? row[0] : 'แถวที่ ' + (ri + 1), parts = [];
      row.forEach(function (c, ci) { if (c === null) { total++; var v = (S.ans[prefix + '-' + bi + '-' + ri + '-' + ci] || '').trim(); if (v) { filled++; parts.push(b.head[ci] + ': ' + v); } } });
      if (parts.length) lines.push('• ' + label + ' — ' + parts.join(' | '));
    });
    if (b.t === 'check') { var n = b.items.filter(function (t, ci) { return S.chk[prefix + '-c' + bi + '-' + ci]; }).length; lines.push('• ' + b.label + ': ติ๊กแล้ว ' + n + '/' + b.items.length); }
  });
  return { text: lines.join('\n'), filled: filled, total: total };
}
function post(payload) {
  return fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
    .then(function (res) { return res.json(); })
    .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'ส่งไม่สำเร็จ'); return j; });
}
function baseInfo(u) { var p = S.student; return { name: p.name, room: p.room, no: p.no, group: p.group || '', unit: 'หน่วยที่ ' + u.no }; }
var pendingAfterProfile = null;
function send(key, payload, okMsg) {
  if (!SCRIPT_URL) { toast('ครูยังไม่ได้เปิดระบบส่งงาน'); return; }
  if (!profileOk()) { pendingAfterProfile = function () { send(key, payload(), okMsg); }; openProfile(); return; }
  var data = typeof payload === 'function' ? payload() : payload;
  sending[key] = true; rerender();
  post(data).then(function (j) { S.sent[key] = Date.now(); save(); toast(okMsg + (j.attempt > 1 ? ' (ครั้งที่ ' + j.attempt + ')' : '')); })
    .catch(function () { toast('ส่งไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่ คำตอบยังอยู่ครบ'); })
    .then(function () { delete sending[key]; rerender(); });
}
function sendWork() {
  var r = route(), u = C.units[r.ui], it = u.items[r.ii], key = 'work-' + prefixOf(it);
  send(key, function () {
    var c = collect(it), d = baseInfo(u);
    if (!c.filled) return null;
    d.type = 'work'; d.code = it.code; d.title = it.title; d.source = it.perSource ? 'แหล่งที่ ' + (S.src + 1) + ' ' + C.SRC[S.src] : '';
    d.answers = c.text; d.filled = c.filled; d.total = c.total; return d;
  }, 'ส่งใบงานถึงครูแล้ว');
}
function sendQuiz() {
  var r = route(), u = C.units[r.ui], it = u.items[r.ii];
  send('quiz-' + it.id, function () {
    var picks = S.qa[it.id] || {}, score = 0, detail = it.qs.map(function (q, qi) { var ok = picks[qi] === q.a; if (ok) score++; return (qi + 1) + '.' + (picks[qi] !== undefined ? LET[picks[qi]] : '-') + (ok ? '✓' : '✗'); });
    var d = baseInfo(u); d.type = 'quiz'; d.code = it.code; d.title = it.title; d.score = score; d.total = it.qs.length; d.detail = detail.join(' '); return d;
  }, 'ส่งคะแนนถึงครูแล้ว');
}

/* ---------- ข้อมูลนักเรียน ---------- */
var dlg = document.getElementById('prof'), form = document.getElementById('profForm');
function openProfile() { ['name', 'room', 'no', 'group'].forEach(function (k) { form.elements[k].value = S.student[k] || ''; }); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
form.addEventListener('submit', function (e) {
  e.preventDefault();
  ['name', 'room', 'no', 'group'].forEach(function (k) { S.student[k] = form.elements[k].value.trim(); });
  save(); dlg.close(); rerender(); toast('บันทึกข้อมูลนักเรียนแล้ว');
  if (pendingAfterProfile && profileOk()) { var f = pendingAfterProfile; pendingAfterProfile = null; f(); }
});
document.getElementById('profCancel').addEventListener('click', function () { pendingAfterProfile = null; dlg.close(); });

/* ---------- events ---------- */
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-key');
  if (k && e.target.tagName === 'TEXTAREA') { S.ans[k] = e.target.value; save(); }
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), r = route();
  if (act === 'scroll') return;
  var it = r.view === 'unit' ? C.units[r.ui].items[r.ii] : null;
  if (act === 'profile') { pendingAfterProfile = null; openProfile(); }
  else if (act === 'chk') { var k = el.getAttribute('data-key'); S.chk[k] = !S.chk[k]; save(); rerender(); }
  else if (act === 'src') { S.src = +el.getAttribute('data-k'); save(); rerender(); }
  else if (act === 'mark') { S.done[it.id] = !S.done[it.id]; save(); rerender(); }
  else if (act === 'pick') { var a = S.qa[it.id] || (S.qa[it.id] = {}); a[el.getAttribute('data-q')] = +el.getAttribute('data-o'); save(); rerender(); }
  else if (act === 'submitquiz') {
    S.qc[it.id] = true; delete S.sent['quiz-' + it.id]; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    if (SCRIPT_URL && profileOk()) sendQuiz();
  }
  else if (act === 'retry') { S.qa[it.id] = {}; S.qc[it.id] = false; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (act === 'sendquiz') sendQuiz();
  else if (act === 'sendwork') {
    if (!collect(it).filled) { toast('ยังไม่ได้เขียนคำตอบในใบงานนี้'); return; }
    sendWork();
  }
  else if (act === 'print') window.print();
  else if (act === 'next') {
    if (it.kind !== 'q') { S.done[it.id] = true; save(); }
    var items = C.units[r.ui].items;
    location.hash = r.ii < items.length - 1 ? link(r.ui, r.ii + 1) : (r.ui < C.units.length - 1 ? link(r.ui + 1, 0) : '#/');
  }
});
window.addEventListener('hashchange', function () { if (location.hash === '#units') return; render(); window.scrollTo(0, 0); });
if (location.hash === '#units') location.hash = '#/';
render();
</script>
